<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rəna</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 45%, #fad0c4 100%);
      position: relative;
    }

    .container {
      text-align: center;
      padding: 40px 24px;
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.18);
      z-index: 2;
      max-width: 700px;
      width: calc(100% - 32px);
      border: 1px solid rgba(255,255,255,0.35);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 72px);
      color: #fff;
      text-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }

    .subtitle {
      margin-top: 18px;
      font-size: clamp(18px, 3vw, 28px);
      color: #fff;
      line-height: 1.6;
    }

    .big-heart {
      font-size: 70px;
      margin: 18px 0 10px;
      animation: pulse 1.4s infinite;
      display: inline-block;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.15));
    }

    .note {
      margin-top: 20px;
      color: #fff;
      font-size: 18px;
      opacity: 0.95;
    }

    .floating-heart {
      position: absolute;
      color: rgba(255,255,255,0.85);
      animation: floatUp linear infinite;
      user-select: none;
      pointer-events: none;
      text-shadow: 0 6px 12px rgba(0,0,0,0.12);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh) scale(0.8);
        opacity: 0;
      }
      15% { opacity: 1; }
      85% { opacity: 1; }
      to {
        transform: translateY(-20vh) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="big-heart">❤️</div>
    <h1>Rəna, gözəl qız</h1>
    <div class="subtitle">
      Sən ürəyimdə çox özəlsən 💖<br>
      Rəna, nə olar şəklini mənə göndər 🙏💔<br>
      <span style="font-size:22px;">🥺👉👈</span>
    </div>
    <div class="note">Səni gülərkən görmək hər şeyə dəyər ✨</div>
  </div>

  <script>
    const heartCount = 24;
    for (let i = 0; i < heartCount; i++) {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.textContent = Math.random() > 0.5 ? '❤' : '💗';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (18 + Math.random() * 28) + 'px';
      heart.style.animationDuration = (5 + Math.random() * 7) + 's';
      heart.style.animationDelay = (Math.random() * 6) + 's';
      document.body.appendChild(heart);
    }
  </script>
</body>
</html>
